<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISRO CS Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="light"]{
  --bg:#f7f6f3; --surface:#ffffff; --surface-2:#f0eee9; --surface-3:#e7e4dd;
  --fg:#16150f; --fg-dim:#3f3c33; --fg-faint:#6e6a5e;
  --rule:#e2dfd7; --rule-strong:#c6c1b5;
  --accent:#9a3412; --accent-soft:#fdf1ea;
  --ok:#15803d; --ok-soft:#edf8f0; --ok-rule:#15803d;
  --no:#b91c1c; --no-soft:#fdf0ef; --no-rule:#b91c1c;
  --tip:#1d4ed8; --tip-soft:#eff4fe; --tip-rule:#1d4ed8;
  --warn:#a16207; --warn-soft:#fdf8e8;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px -8px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110; --surface:#1b1a17; --surface-2:#232120; --surface-3:#2d2a27;
    --fg:#f2f0ea; --fg-dim:#cbc7bd; --fg-faint:#908b7f;
    --rule:#312e29; --rule-strong:#4a453d;
    --accent:#fb923c; --accent-soft:#2b1a11;
    --ok:#4ade80; --ok-soft:#102418; --ok-rule:#4ade80;
    --no:#f87171; --no-soft:#2a1211; --no-rule:#f87171;
    --tip:#93c5fd; --tip-soft:#111a2d; --tip-rule:#93c5fd;
    --warn:#fcd34d; --warn-soft:#241e0c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1b1a17; --surface-2:#232120; --surface-3:#2d2a27;
  --fg:#f2f0ea; --fg-dim:#cbc7bd; --fg-faint:#908b7f;
  --rule:#312e29; --rule-strong:#4a453d;
  --accent:#fb923c; --accent-soft:#2b1a11;
  --ok:#4ade80; --ok-soft:#102418; --ok-rule:#4ade80;
  --no:#f87171; --no-soft:#2a1211; --no-rule:#f87171;
  --tip:#93c5fd; --tip-soft:#111a2d; --tip-rule:#93c5fd;
  --warn:#fcd34d; --warn-soft:#241e0c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 120px}

/* header */
header.top{padding:34px 0 18px;border-bottom:2px solid var(--fg);margin-bottom:20px}
.kick{font-size:11.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px}
h1{font-size:clamp(26px,5vw,38px);margin:0 0 8px;font-weight:800;letter-spacing:-.025em;line-height:1.08}
.sub{color:var(--fg-dim);font-size:16px;margin:0;max-width:60ch}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--surface-2);
  border-radius:12px;margin-bottom:8px;scrollbar-width:thin}
.tab{flex:none;padding:9px 15px;border:none;background:none;border-radius:8px;cursor:pointer;
  font:inherit;font-size:14px;font-weight:600;color:var(--fg-faint);white-space:nowrap;transition:.12s}
.tab:hover{color:var(--fg);background:var(--surface-3)}
.tab.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}

/* controls */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 18px}
select,.btn{font:inherit;font-size:14px;font-weight:600;padding:8px 13px;border-radius:9px;
  border:1px solid var(--rule-strong);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:none}
.btn:hover{filter:brightness(.97)}
.spacer{flex:1}
.score{font-size:13.5px;font-weight:700;color:var(--fg-dim);
  background:var(--surface);padding:8px 13px;border-radius:9px;border:1px solid var(--rule);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{color:var(--accent)}

/* question card */
.q{background:var(--surface);border:1px solid var(--rule);border-radius:14px;
  padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qn{font-size:12.5px;font-weight:800;color:#fff;background:var(--fg);
  padding:3px 10px;border-radius:7px}
.qs{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:20px;
  border:1px solid var(--accent)}
.qf{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);
  padding:3px 9px;border-radius:20px;border:1px solid var(--warn)}
.stem{font-family:"Source Serif 4",Georgia,serif;font-size:17.5px;line-height:1.5;margin:0 0 15px}
.stem .mono,.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.88em;
  background:var(--surface-2);padding:1px 5px;border-radius:4px}
pre{font-family:"JetBrains Mono",monospace;font-size:13px;background:var(--surface-2);
  padding:11px 13px;border-radius:9px;overflow-x:auto;border:1px solid var(--rule);margin:10px 0}

/* options */
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:10px;
  border:1.5px solid var(--rule);background:var(--surface);cursor:pointer;transition:.12s;
  font-size:15.5px;text-align:left;width:100%;font-family:inherit;color:var(--fg)}
.opt:hover:not(.locked){border-color:var(--rule-strong);background:var(--surface-2)}
.opt .lab{flex:none;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--rule-strong);
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--fg-faint)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .lab{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.locked{cursor:default}
.opt.right{border-color:var(--ok-rule);background:var(--ok-soft)}
.opt.right .lab{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--no-rule);background:var(--no-soft)}
.opt.wrong .lab{background:var(--no);color:#fff;border-color:var(--no)}
.mark{margin-left:auto;font-size:12px;font-weight:800;flex:none;align-self:center}
.mark.ok{color:var(--ok)} .mark.no{color:var(--no)}

/* actions */
.qact{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.verdict{font-size:14px;font-weight:800;padding:5px 12px;border-radius:8px}
.verdict.ok{color:var(--ok);background:var(--ok-soft)}
.verdict.no{color:var(--no);background:var(--no-soft)}
.verdict.skip{color:var(--fg-faint);background:var(--surface-2)}

/* reveal */
.reveal{margin-top:15px;padding-top:15px;border-top:1px dashed var(--rule-strong);
  animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.reveal h4{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  margin:0 0 7px;color:var(--ok)}
.reveal p{margin:0 0 9px;font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.5}
.reveal p:last-child{margin-bottom:0}
.cbox{margin-top:12px;background:var(--tip-soft);border:1px solid var(--tip-rule);
  border-left-width:4px;border-radius:10px;padding:12px 15px}
.cbox h4{color:var(--tip)}
.cbox p{font-size:15.5px;color:var(--fg-dim)}
.w26{margin-top:10px;background:var(--warn-soft);border:1px solid var(--warn);
  border-left-width:4px;border-radius:10px;padding:11px 15px}
.w26 h4{color:var(--warn)}
.w26 p{font-size:15px;color:var(--fg-dim)}

/* summary / trends */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;
  padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:21px;font-weight:800;letter-spacing:-.015em}
.card h3{margin:20px 0 8px;font-size:16px;font-weight:700}
.card p{margin:0 0 11px;font-size:15.5px;color:var(--fg-dim);line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:12px 0}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-faint);
  font-weight:800;background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--ok);font-weight:800} .down{color:var(--no);font-weight:800}
tr.tot td{font-weight:800;border-top:2px solid var(--fg-faint);background:var(--surface-2)}
.bars{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.brow{display:grid;grid-template-columns:minmax(120px,1.4fr) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.btrack{height:20px;background:var(--surface-2);border-radius:5px;overflow:hidden;display:flex}
.bfill{height:100%;background:var(--accent);border-radius:5px 0 0 5px}
.bfill.b2{background:var(--tip)}
.bnum{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--fg-dim);min-width:68px;text-align:right}
.empty{text-align:center;padding:50px 20px;color:var(--fg-faint)}

/* sticky footer bar */
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
  border-top:1px solid var(--rule);padding:10px 16px;box-shadow:0 -4px 16px -8px rgba(0,0,0,.2);z-index:50}
.sticky .in{max-width:900px;margin:0 auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:110px;height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progf{height:100%;background:var(--accent);transition:width .25s}
.ptxt{font-size:12.5px;font-weight:700;color:var(--fg-faint);font-variant-numeric:tabular-nums;white-space:nowrap}

mjx-container svg{max-width:100%;height:auto}
mjx-container[display="true"]{margin:.4em 0!important}
@media (max-width:640px){
  body{font-size:15px}
  .wrap{padding:0 16px 130px}
  .q,.card{padding:16px 15px}
  .stem{font-size:16.5px}
  .brow{grid-template-columns:1fr;gap:3px}
  .bnum{text-align:left}
}
</style>

window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['$$','$$']]},
  svg:{fontCache:'global'},options:{skipHtmlTags:['script','noscript','style','textarea','pre']}};
</script>

<body>
<div class="wrap">
<header class="top">
  <div class="kick">ISRO &middot; Scientist/Engineer &lsquo;SC&rsquo; &middot; Computer Science</div>
  <h1>ISRO CS Practice</h1>
  <p class="sub">Answer first, then reveal. Real papers from 2025 and 2023, trend analysis, and three predicted 2026 sets built from the shift between them.</p>
</header>

<div class="tabs" id="tabs"></div>
<div class="bar" id="bar"></div>
<div id="view"></div>
</div>

<div class="sticky"><div class="in">
  <div class="prog"><div class="progf" id="progf" style="width:0%"></div></div>
  <span class="ptxt" id="ptxt">0 / 0</span>
  <button class="btn ghost" id="jump">Next unanswered</button>
  <button class="btn ghost" id="reset">Reset set</button>
</div></div>

<script src="d1.js"></script>
<script src="d2.js"></script>
<script src="d3.js"></script>
<script src="d4.js"></script>
<script src="d5.js"></script>
<script src="d6.js"></script>
<script src="d7.js"></script>
<script src="d8.js"></script>
<script src="d9.js"></script>
<script src="d10.js"></script>
<script src="d11.js"></script>
<script>
(function(){
  "use strict";
  var D = window.ISRO || {sets:[],trends:null};
  var state = {};          // key -> {pick, done}
  var cur = D.sets.length ? D.sets[0].id : null;
  var filter = "all";

  /* ---------- storage (per-viewer only; must survive being unavailable) ---------- */
  var KEY="isro_practice_v1";
  function load(){ try{ var r=localStorage.getItem(KEY); if(r) state=JSON.parse(r)||{}; }catch(e){ state={}; } }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
  load();

  function k(sid,n){ return sid+"#"+n; }
  function setOf(id){ for(var i=0;i<D.sets.length;i++) if(D.sets[i].id===id) return D.sets[i]; return null; }
  function esc(s){ return String(s==null?"":s); }

  /* ---------- tabs ---------- */
  function drawTabs(){
    var h="";
    D.sets.forEach(function(s){
      h+='<button class="tab'+(s.id===cur?' on':'')+'" data-t="'+s.id+'">'+esc(s.label)+'</button>';
    });
    h+='<button class="tab'+(cur==='__trends'?' on':'')+'" data-t="__trends">Trends &amp; 2026 forecast</button>';
    document.getElementById('tabs').innerHTML=h;
  }

  /* ---------- controls ---------- */
  function drawBar(){
    var el=document.getElementById('bar');
    if(cur==='__trends'){ el.innerHTML=''; return; }
    var s=setOf(cur); if(!s){ el.innerHTML=''; return; }
    var subs={}; s.q.forEach(function(q){ subs[q.s]=(subs[q.s]||0)+1; });
    var names=Object.keys(subs).sort();
    var o='<option value="all">All subjects ('+s.q.length+')</option>';
    names.forEach(function(n){ o+='<option value="'+esc(n)+'"'+(filter===n?' selected':'')+'>'+esc(n)+' ('+subs[n]+')</option>'; });
    var done=0,right=0;
    s.q.forEach(function(q){ var st=state[k(s.id,q.n)]; if(st&&st.done){ done++; if(st.pick===q.a) right++; } });
    el.innerHTML='<select id="fsub">'+o+'</select>'+
      '<button class="btn ghost" id="revealAll">Reveal all</button>'+
      '<span class="spacer"></span>'+
      '<span class="score">Attempted <b>'+done+'</b> / '+s.q.length+' &nbsp;&middot;&nbsp; Correct <b>'+right+'</b>'+
      (done? ' ('+Math.round(right/done*100)+'%)':'')+'</span>';
    document.getElementById('fsub').onchange=function(){ filter=this.value; render(); };
    document.getElementById('revealAll').onclick=function(){
      if(!confirm('Reveal every answer in this set? Your picks are kept.')) return;
      s.q.forEach(function(q){ var key=k(s.id,q.n); var st=state[key]||{pick:null}; st.done=true; state[key]=st; });
      save(); render();
    };
  }

  /* ---------- question rendering ---------- */
  function qCard(s,q){
    var key=k(s.id,q.n), st=state[key]||{pick:null,done:false};
    var h='<div class="q" id="q_'+q.n+'"><div class="qhead">'+
      '<span class="qn">Q'+q.n+'</span><span class="qs">'+esc(q.s)+'</span>'+
      (q.f?'<span class="qf">figure-based</span>':'')+'</div>';
    h+='<div class="stem">'+q.q+'</div><div class="opts">';
    for(var i=0;i<q.o.length;i++){
      var cls='opt', mark='';
      if(st.done){
        cls+=' locked';
        if(i===q.a){ cls+=' right'; mark='<span class="mark ok">correct</span>'; }
        else if(st.pick===i){ cls+=' wrong'; mark='<span class="mark no">your pick</span>'; }
      } else if(st.pick===i){ cls+=' sel'; }
      h+='<button class="'+cls+'" data-q="'+q.n+'" data-o="'+i+'"'+(st.done?' disabled':'')+'>'+
         '<span class="lab">'+"ABCD".charAt(i)+'</span><span>'+q.o[i]+'</span>'+mark+'</button>';
    }
    h+='</div><div class="qact">';
    if(!st.done){
      h+='<button class="btn primary" data-sub="'+q.n+'"'+(st.pick==null?' disabled':'')+'>Submit answer</button>';
      h+='<button class="btn ghost" data-skip="'+q.n+'">Skip &amp; reveal</button>';
      if(st.pick==null) h+='<span class="ptxt">Pick an option first</span>';
    } else {
      var v = st.pick==null ? '<span class="verdict skip">Skipped</span>'
            : (st.pick===q.a ? '<span class="verdict ok">Correct</span>'
                             : '<span class="verdict no">Incorrect</span>');
      h+=v+'<button class="btn ghost" data-undo="'+q.n+'">Try again</button>';
    }
    h+='</div>';
    if(st.done){
      h+='<div class="reveal"><h4>Why '+"ABCD".charAt(q.a)+' is right</h4><p>'+q.e+'</p>';
      if(q.c) h+='<div class="cbox"><h4>Concept &amp; shortcut</h4><p>'+q.c+'</p></div>';
      if(q.w) h+='<div class="w26"><h4>Watch for 2026</h4><p>'+q.w+'</p></div>';
      h+='</div>';
    }
    return h+'</div>';
  }

  function render(){
    drawTabs(); drawBar();
    var v=document.getElementById('view');
    if(cur==='__trends'){ v.innerHTML=D.trendsHTML||'<div class="empty">No trend data.</div>'; typeset(); progress(); return; }
    var s=setOf(cur);
    if(!s){ v.innerHTML='<div class="empty">Nothing here.</div>'; return; }
    var list=s.q.filter(function(q){ return filter==='all'||q.s===filter; });
    if(!list.length){ v.innerHTML='<div class="empty">No questions match.</div>'; return; }
    var h='';
    if(s.note) h+='<div class="card"><p style="margin:0">'+s.note+'</p></div>';
    list.forEach(function(q){ h+=qCard(s,q); });
    v.innerHTML=h; typeset(); progress();
  }

  function typeset(){
    if(window.MathJax&&MathJax.typesetPromise){ MathJax.typesetPromise().catch(function(){}); }
  }

  function progress(){
    var s=setOf(cur);
    if(!s){ document.getElementById('progf').style.width='0%'; document.getElementById('ptxt').textContent='—'; return; }
    var done=0; s.q.forEach(function(q){ var st=state[k(s.id,q.n)]; if(st&&st.done) done++; });
    var pct=s.q.length?Math.round(done/s.q.length*100):0;
    document.getElementById('progf').style.width=pct+'%';
    document.getElementById('ptxt').textContent=done+' / '+s.q.length;
  }

  /* ---------- events ---------- */
  document.getElementById('tabs').addEventListener('click',function(e){
    var b=e.target.closest('[data-t]'); if(!b) return;
    cur=b.getAttribute('data-t'); filter='all'; window.scrollTo(0,0); render();
  });

  document.getElementById('view').addEventListener('click',function(e){
    var s=setOf(cur); if(!s) return;
    var o=e.target.closest('[data-o]');
    if(o && !o.disabled){
      var n=+o.getAttribute('data-q'), i=+o.getAttribute('data-o'), key=k(s.id,n);
      var st=state[key]||{pick:null,done:false};
      if(st.done) return;
      st.pick=(st.pick===i?null:i); state[key]=st; save(); render();
      var el=document.getElementById('q_'+n); if(el) el.scrollIntoView({block:'nearest'});
      return;
    }
    var sub=e.target.closest('[data-sub]');
    if(sub && !sub.disabled){
      var n2=+sub.getAttribute('data-sub'), key2=k(s.id,n2);
      var st2=state[key2]||{pick:null}; if(st2.pick==null) return;
      st2.done=true; state[key2]=st2; save(); render();
      var el2=document.getElementById('q_'+n2); if(el2) el2.scrollIntoView({block:'nearest'});
      return;
    }
    var sk=e.target.closest('[data-skip]');
    if(sk){
      var n3=+sk.getAttribute('data-skip'), key3=k(s.id,n3);
      state[key3]={pick:null,done:true}; save(); render();
      var el3=document.getElementById('q_'+n3); if(el3) el3.scrollIntoView({block:'nearest'});
      return;
    }
    var un=e.target.closest('[data-undo]');
    if(un){
      var n4=+un.getAttribute('data-undo'); delete state[k(s.id,n4)]; save(); render();
      var el4=document.getElementById('q_'+n4); if(el4) el4.scrollIntoView({block:'nearest'});
      return;
    }
  });

  document.getElementById('jump').onclick=function(){
    var s=setOf(cur); if(!s) return;
    for(var i=0;i<s.q.length;i++){
      var q=s.q[i], st=state[k(s.id,q.n)];
      if(!st||!st.done){
        if(filter!=='all'&&q.s!==filter){ filter='all'; render(); }
        var el=document.getElementById('q_'+q.n);
        if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); }
        return;
      }
    }
    alert('Every question in this set is done.');
  };

  document.getElementById('reset').onclick=function(){
    var s=setOf(cur); if(!s) return;
    if(!confirm('Clear your answers for '+s.label+'?')) return;
    s.q.forEach(function(q){ delete state[k(s.id,q.n)]; });
    save(); render();
  };

  render();
})();
</script>
</body>
</html>
